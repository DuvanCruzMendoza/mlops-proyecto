# Configuración del proyecto: imputación de la producción bruta (EAM, DANE).
# Todo lo que puede cambiar (datos, modelo, MLflow) vive aquí, no en el código.
# Las rutas son relativas a la raíz del repositorio (desde ahí se ejecuta todo).

datos:
  carpeta: data/raw                         # Excel descargados del ANDA (no se versionan, ver data/README.md)
  patron_archivo: EAM_ANONIMIZADA_{anio}.xlsx
  anios: [2020, 2021, 2022, 2023, 2024]
  salida: data/processed/eam_2020_2024.csv  # CSV unificado que genera scripts/load_data.py
