# Configuración del proyecto: imputación de la producción bruta (EAM, DANE).
# Todo lo que puede cambiar (datos, modelos, umbrales, MLflow) vive aquí, no en el código.
# La selección de variables está en configs/features.yaml.
# Las rutas son relativas a la raíz del repositorio (desde ahí se ejecuta todo).

datos:
  carpeta: data/raw                         # Excel descargados del ANDA (no se versionan, ver data/README.md)
  patron_archivo: EAM_ANONIMIZADA_{anio}.xlsx
  anios: [2020, 2021, 2022, 2023, 2024]
  salida: data/processed/eam_2020_2024.csv  # CSV unificado que genera scripts/load_data.py

division:
  anio_prueba: 2024         # se entrena con los años anteriores y se evalúa con este (simula "llega un año nuevo")

variables:
  usar_rezago: true         # usa los datos del año anterior del mismo establecimiento (ver configs/features.yaml)

# Modelos que compara el pipeline de entrenamiento. Cada uno es un run en MLflow.
# Solo el de menor MAE puede pasar a champion. Para quitar uno, coméntalo.
candidatos:
  - nombre_run: ridge
    tipo: ridge
    parametros:
      alpha: 1.0
  - nombre_run: hgb
    tipo: hist_gradient_boosting
    parametros:
      max_iter: 400
      learning_rate: 0.05
      random_state: 42

# Registro en el Model Registry de MLflow y criterio para ser champion.
# El modelo es de regresión, así que en lugar del AUC se usa el MAE (en log): menor es mejor.
registro:
  nombre_modelo: eam-imputacion-prodbind
  max_mae_log: 0.30                 # MAE máximo para ser champion
  exigir_superar_linea_base: true   # además, debe tener menor MAE que la línea base (producción del año anterior)
  # y siempre debe tener menor MAE que el champion vigente

inferencia:
  anio: 2024                        # año del que se toma el lote de establecimientos
  tamano_lote: 500                  # establecimientos que se imputan en cada ejecución diaria
  semilla: null                     # null: un lote distinto cada día. Un número: siempre el mismo lote
  umbral_alerta: 0.5                # marca si |log(reportado / estimado)| > 0.5 (diferencia de ~65 % o más)
  carpeta_salida: data/predicciones # un CSV por día: predicciones_AAAA-MM-DD.csv (no se versiona)

mlflow:
  tracking_uri: http://localhost:5000  # servidor de MLflow de services/. MLFLOW_TRACKING_URI, si existe, tiene prioridad
  experimento: eam-imputacion-a2       # entrenamiento (fase=entrenamiento) e inferencia (fase=inferencia)
