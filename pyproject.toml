[project]
name = "mlops-proyecto"
version = "0.1.0"
description = "Proyecto academico de MLOps para el desarrollo, seguimiento y despliegue de modelos de aprendizaje automatico."
authors = [
    {name = "Duvan Arley Cruz Mendoza",email = "duvan1606@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.16"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "mlflow (>=3.17.2,<4.0.0)",
    "prefect (>=3.9.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
