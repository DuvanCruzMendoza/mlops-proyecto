[project]
name = "mlops-proyecto"
version = "0.1.0"
description = "Proyecto academico de MLOps para el desarrollo, seguimiento y despliegue de modelos de aprendizaje automatico."
authors = [
    {name = "Duvan Arley Cruz Mendoza",email = "duvan1606@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pandas (==3.0.6)",
    "numpy (==2.5.4)",
    "scikit-learn (==1.9.1)",
    "mlflow (==3.17.0)",
    "prefect (==3.8.8)",
    "pyyaml (==6.0.3)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "pytest (==9.1.1)"
]
