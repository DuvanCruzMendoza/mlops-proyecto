# Actividad 3: ejecuta las pruebas en cada push y en cada Pull Request.
# Los Excel de la EAM no se versionan: las pruebas con datos reales se omiten (skip)
# y el resto usa datos falsos y un MLflow temporal (SQLite), sin servicios.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Poetry
        run: pipx install poetry
      - name: Instalar dependencias
        run: poetry install --no-interaction
      - name: Ejecutar pruebas
        run: poetry run pytest -ra
